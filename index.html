<style>
*{box-sizing:border-box}

    break-inside:avoid
  }

<body>

<header>
  <h1>Çeto Senaryo</h1>
  <div class="version">OFFLINE v5.1</div>
</header>

<main>

<div id="home">

  <div class="card">
    <h3 style="margin-top:0">Yeni Bölüm</h3>

    <input
      id="episodeName"
      placeholder="Bölüm adı — örn. Haysiyet 4. Bölüm"
    >

    <div style="height:8px"></div>

    <input
      id="pdfFile"
      type="file"
      accept="application/pdf"
    >

    <div style="height:10px"></div>

    <button
      class="primary"
      style="width:100%"
      onclick="importPDF()"
    >
      PDF'yi Oku ve Döküm Oluştur
    </button>

    <div id="status" class="progress hidden"></div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Kayıtlı Bölümler</h3>
    <div id="episodes"></div>
  </div>

</div>

<div id="episodeView" class="hidden">

  <div class="card no-print">
    <div class="row">
      <button class="secondary" onclick="goHome()">← Bölümler</button>
      <button class="secondary" onclick="window.print()">PDF / Yazdır</button>
      <button class="secondary" onclick="exportCSV()">CSV</button>
    </div>
  </div>

  <div class="card">
    <h2 id="currentTitle" style="margin:0"></h2>
    <div id="summary" class="small" style="margin-top:5px"></div>
  </div>

  <div class="tabs no-print">
    <button id="tabPlayers" class="tab active" onclick="showTab('players')">
      Oyuncular
    </button>

    <button id="tabScenes" class="tab" onclick="showTab('scenes')">
      Sahneler
    </button>
  </div>

  <div id="playersView"></div>
  <div id="scenesView" class="hidden"></div>

</div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js?v=5"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js?v=5';

const STORE='cetoEpisodesV5';
let currentId=null;

function norm(s){
  return String(s||'')
    .replace(/\u00a0/g,' ')
    .replace(/[ \t]+/g,' ')
    .trim();
}

function fold(s){
  return norm(s)
    .toLocaleUpperCase('tr-TR')
    .replace(/İ/g,'I')
    .replace(/Ş/g,'S')
    .replace(/Ğ/g,'G')
    .replace(/Ü/g,'U')
    .replace(/Ö/g,'O')
    .replace(/Ç/g,'C');
}

function key(s){
  return norm(s).toLocaleUpperCase('tr-TR');
}

function loadEpisodes(){
  try{
    return JSON.parse(localStorage.getItem(STORE)||'[]');
  }catch(e){
    return [];
  }
}

function saveEpisodes(a){
  localStorage.setItem(STORE,JSON.stringify(a));
}

function esc(s){
  return String(s??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function uid(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function setStatus(t){
  const e=document.getElementById('status');
  e.textContent=t;
  e.classList.remove('hidden');
}

function hideStatus(){
  document.getElementById('status').classList.add('hidden');
}

function sceneHeader(line){

  let s=norm(line.text)
    .replace(/[＊*]+/g,' ')
    .trim();

  /*
    Gerçek senaryo örneği:

    1 HALUK EV BAHÇE DIŞ GECE 1
    2 KARLIOVA EV SALON İÇ GECE 2
    3 KARLIOVA EV BAHÇE GECE 3

    PDF.js bazı sayfalarda sondaki tekrar numarasını
    farklı birleştirebildiği için yalnızca baştaki
    sahne numarasını kesin şart kabul ediyoruz.
  */

  let m=s.match(/^(\d{1,3})\s+(.+)$/);

  if(!m) return null;

  let no=+m[1];
  let middle=norm(m[2]);

  /*
    Sonda aynı sahne numarası bulunuyorsa kaldır.
  */

  let tail=new RegExp('\\s+'+no+'\\s*$');
  middle=middle.replace(tail,'').trim();

  /*
    Sahne başlığında GÜN / GECE veya
    İÇ / DIŞ ibaresi bulunmalı.
  */

  let f=fold(middle);

  if(!/\b(GUN|GECE|IC|DIS)\b/.test(f)){
    return null;
  }

  let time='';
  let io='';

  let t=middle.match(
    /\s+(GECE-GÜN|GÜN-GECE|GÜN|GECE)$/i
  );

  if(t){
    time=key(t[1]);
    middle=middle.slice(0,t.index).trim();
  }

  let d=middle.match(
    /\s+(İÇ|IÇ|IC|DIŞ|DIS)$/i
  );

  if(d){
    io=key(d[1])
      .replace('IC','İÇ')
      .replace('IÇ','İÇ')
      .replace('DIS','DIŞ');

    middle=middle.slice(0,d.index).trim();
  }

  if(!middle) return null;

  return {
    no:no,
    location:middle,
    io:io,
    time:time
  };
}

function detectEpisode(text){
  const m=text.match(/(\d+)\.?\s*BÖLÜM/i);
  return m ? m[1]+'. Bölüm' : '';
}

const STOP=new Set([
  'GÜN',
  'GECE',
  'İÇ',
  'DIŞ',
  'DEVAM',
  'KESME',
  'FLASHBACK',
  'MÜZİK',
  'MÜZIK',
  'MÜZİK ALTI',
  'MÜZIK ALTI',
  'JENERİK',
  'JENERIK',
  'SON',
  'SAHNE',
  'SALON',
  'ODA',
  'MUTFAK',
  'BAHÇE',
  'KORİDOR',
  'KORIDOR',
  'ARABA',
  'ARAÇ',
  'ARAC',
  'EV',
  'HASTANE',
  'OFİS',
  'OFIS',
  'OTEL',
  'UÇAK',
  'UCAK'
].map(fold));

function cleanCharacterName(s){

  s=norm(s)
    .replace(/[＊*]+/g,' ')
    .replace(/\([^)]*\)/g,' ')
    .replace(/[:.]+$/,'')
    .trim();

  s=key(s);

  if(fold(s)==='SIMAY') return 'SİMAY';
  if(fold(s)==='AZIZ') return 'AZİZ';

  if(
    fold(s)==='SEBAHAT' ||
    fold(s)==='SABAHAT'
  ){
    return 'SEBAHAT / SABAHAT';
  }

  return s;
}

function extractCue(line){

  let s=norm(line.text);

  if(!s) return null;

  /*
    Ses dışı konuşmalar fiziksel oyuncu kabul edilmez.
  */

  const voiceOnly=
    /\((V\.?O\.?|O\.?S\.?|OFF|DIŞ SES|DIS SES)\)/i.test(s);

  let clean=s
    .replace(/\([^)]*\)/g,' ')
    .replace(/[＊*]+/g,' ')
    .trim();

  if(!clean) return null;

  /*
    Karakter cue'su genelde tamamen büyük harftir.
  */

  if(clean!==clean.toLocaleUpperCase('tr-TR')){
    return null;
  }

  /*
    Çok uzun satırlar karakter adı değildir.
  */

  let words=clean.split(/\s+/);

  if(words.length>5){
    return null;
  }

  let f=fold(clean);

  if(STOP.has(f)){
    return null;
  }

  /*
    Sahne başlığı gibi görünen satırları ele.
  */

  if(/\b(IC|DIS|GUN|GECE)\b/.test(f)){
    return null;
  }

  /*
    Sayı içeren satırlar karakter cue'su değildir.
  */

  if(/\d/.test(clean)){
    return null;
  }

  /*
    Karakter adında en az bir harf olmalı.
  */

  if(!/[A-ZÇĞİÖŞÜ]/i.test(clean)){
    return null;
  }

  return {
    name:cleanCharacterName(clean),
    physical:!voiceOnly
  };
}

function probableProperNames(text){

  const result=[];

  let cleaned=norm(text)
    .replace(/[“”"']/g,' ')
    .replace(/[()]/g,' ');

  /*
    Türkçe özel isim adaylarını yakala.
    Bu aşama yalnızca karakter sözlüğü oluşturmak
    için kullanılıyor.
  */

  const re=
    /\b[A-ZÇĞİÖŞÜ][a-zçğıöşü]+(?:\s+[A-ZÇĞİÖŞÜ][a-zçğıöşü]+)?\b/g;

  let m;

  while((m=re.exec(cleaned))){

    let n=cleanCharacterName(m[0]);

    let f=fold(n);

    if(STOP.has(f)) continue;

    if(n.length<2) continue;

    result.push(n);
  }

  return result;
}

function canonical(name){

  let f=fold(name);

  if(f==='SIMAY') return 'SİMAY';
  if(f==='AZIZ') return 'AZİZ';

  if(f==='SEBAHAT' || f==='SABAHAT'){
    return 'SEBAHAT / SABAHAT';
  }

  return cleanCharacterName(name);
}

function sameName(a,b){
  return fold(canonical(a))===fold(canonical(b));
}

function actionMention(text,name){

  let ft=fold(text);
  let fn=fold(name);

  /*
    Birleşik alias.
  */

  if(fn==='SEBAHAT / SABAHAT'){
    return (
      /\bSEBAHAT\b/.test(ft) ||
      /\bSABAHAT\b/.test(ft)
    );
  }

  /*
    Tam isim eşleşmesi.
  */

  let escaped=fn.replace(
    /[.*+?^${}()|[\]\\]/g,
    '\\$&'
  );

  let re=new RegExp(
    '(^|[^A-Z0-9])'+escaped+'([^A-Z0-9]|$)'
  );

  return re.test(ft);
}

function addUnique(arr,name){

  name=canonical(name);

  if(!name) return;

  if(!arr.some(x=>sameName(x,name))){
    arr.push(name);
  }
}

async function pdfLines(file){

  const data=await file.arrayBuffer();

  const pdf=await pdfjsLib.getDocument({
    data:data
  }).promise;

  let lines=[];

  for(let p=1;p<=pdf.numPages;p++){

    setStatus(
      'PDF okunuyor: '+p+' / '+pdf.numPages
    );

    const page=await pdf.getPage(p);
    const content=await page.getTextContent();

    /*
      Aynı Y koordinatındaki PDF parçalarını
      tek satır halinde birleştiriyoruz.
    */

    let rows=[];

    for(const item of content.items){

      if(!item.str) continue;

      const x=item.transform[4];
      const y=item.transform[5];

      let row=rows.find(
        r=>Math.abs(r.y-y)<2
      );

      if(!row){
        row={
          y:y,
          parts:[]
        };
        rows.push(row);
      }

      row.parts.push({
        x:x,
        text:item.str
      });
    }

    rows.sort((a,b)=>b.y-a.y);

    for(const row of rows){

      row.parts.sort(
        (a,b)=>a.x-b.x
      );

      let text=row.parts
        .map(x=>x.text)
        .join(' ');

      text=norm(text);

      if(!text) continue;

      const minX=Math.min(
        ...row.parts.map(x=>x.x)
      );

      lines.push({
        page:p,
        y:row.y,
        x:minX,
        text:text
      });
    }
  }

  return lines;
}

function buildCharacterDictionary(lines){

  const cues={};
  const narrative={};

  /*
    Önce bütün senaryoyu baştan sona tarıyoruz.
  */

  for(const line of lines){

    let c=extractCue(line);

    if(c && c.name){

      let n=canonical(c.name);

      cues[fold(n)]=n;
    }

    /*
      Aksiyon satırları senaryoda çoğunlukla
      sol tarafta yaklaşık x=108 civarında.
    */

    if(line.x<=155){

      for(const n of probableProperNames(line.text)){

        let f=fold(n);

        narrative[f]=
          (narrative[f]||0)+1;
      }
    }
  }

  let chars=[];

  /*
    Konuşma cue'sunda bulunan isimler kesin aday.
  */

  Object.values(cues).forEach(
    n=>addUnique(chars,n)
  );

  /*
    Aksiyon metninde tekrar eden özel isimler
    karakter sözlüğüne eklenir.
  */

  for(const [f,count] of Object.entries(narrative)){

    if(count>=2){

      let candidate=null;

      for(const line of lines){

        if(line.x>155) continue;

        let names=probableProperNames(line.text);

        candidate=names.find(
          n=>fold(n)===f
        );

        if(candidate) break;
      }

      if(candidate){
        addUnique(chars,candidate);
      }
    }
  }

  return chars;
}

function parse(lines){

  const dictionary=
    buildCharacterDictionary(lines);

  const scenes=[];

  let current=null;

  /*
    1) Sahnelere ayır.
  */

  for(const line of lines){

    let h=sceneHeader(line);

    if(h){

      if(current){
        scenes.push(current);
      }

      current={
        no:h.no,
        location:h.location,
        io:h.io,
        time:h.time,
        lines:[],
        players:[]
      };

      continue;
    }

    if(current){
      current.lines.push(line);
    }
  }

  if(current){
    scenes.push(current);
  }

  /*
    2) Her sahnenin oyuncularını tara.
  */

  for(const scene of scenes){

    let players=[];

    /*
      Önce konuşma cue'ları.
    */

    for(const line of scene.lines){

      const cue=extractCue(line);

      if(
        cue &&
        cue.physical &&
        cue.name
      ){
        addUnique(
          players,
          cue.name
        );
      }
    }

    /*
      Sonra aksiyon / sahne yönlendirme metni.

      Diyalog gövdesini taramıyoruz.
      Böylece bir karakter yalnızca konuşmada
      anıldığı için sahnede var sayılmıyor.
    */

    for(const line of scene.lines){

      if(line.x>155){
        continue;
      }

      for(const character of dictionary){

        if(
          actionMention(
            line.text,
            character
          )
        ){
          addUnique(
            players,
            character
          );
        }
      }
    }

    scene.players=players.sort(
      (a,b)=>a.localeCompare(
        b,
        'tr'
      )
    );
  }

  return scenes;
}

async function importPDF(){

  const input=
    document.getElementById('pdfFile');

  const file=input.files[0];

  if(!file){
    alert('Önce PDF seç.');
    return;
  }

  try{

    setStatus('PDF hazırlanıyor...');

    const lines=
      await pdfLines(file);

    setStatus(
      'Senaryo baştan sona analiz ediliyor...'
    );

    const scenes=parse(lines);

    if(!scenes.length){

      throw new Error(
        'Sahne başlığı bulunamadı.'
      );
    }

    const allText=
      lines.map(x=>x.text).join('\n');

    let name=norm(
      document.getElementById(
        'episodeName'
      ).value
    );

    if(!name){
      name=
        detectEpisode(allText) ||
        file.name.replace(/\.pdf$/i,'');
    }

    const ep={
      id:uid(),
      name:name,
      created:new Date().toISOString(),
      scenes:scenes,
      notes:{}
    };

    let eps=loadEpisodes();

    eps.unshift(ep);

    saveEpisodes(eps);

    hideStatus();

    document.getElementById(
      'pdfFile'
    ).value='';

    document.getElementById(
      'episodeName'
    ).value='';

    renderEpisodes();

    openEpisode(ep.id);

  }catch(e){

    console.error(e);

    setStatus(
      'Hata: '+(
        e.message ||
        String(e)
      )
    );

    alert(
      'PDF okunurken hata oluştu:\n\n'+
      (
        e.message ||
        String(e)
      )
    );
  }
}

function renderEpisodes(){

  const box=
    document.getElementById('episodes');

  const eps=loadEpisodes();

  if(!eps.length){

    box.innerHTML=
      '<div class="small">'+
      'Henüz kayıtlı bölüm yok.'+
      '</div>';

    return;
  }

  box.innerHTML=eps.map(ep=>{

    const players=
      getPlayers(ep).length;

    return `
      <div class="episode">

        <div class="episode-title">
          ${esc(ep.name)}
        </div>

        <div class="small">
          ${ep.scenes.length} sahne ·
          ${players} oyuncu
        </div>

        <div
          class="row"
          style="margin-top:9px"
        >

          <button
            class="primary"
            onclick="openEpisode('${ep.id}')"
          >
            Aç
          </button>

          <button
            class="danger"
            onclick="deleteEpisode('${ep.id}')"
          >
            Sil
          </button>

        </div>

      </div>
    `;

  }).join('');
}

function getEpisode(){

  return loadEpisodes().find(
    x=>x.id===currentId
  );
}

function getPlayers(ep){

  let arr=[];

  for(const s of ep.scenes){

    for(const p of s.players||[]){
      addUnique(arr,p);
    }
  }

  return arr.sort(
    (a,b)=>a.localeCompare(
      b,
      'tr'
    )
  );
}

function openEpisode(id){

  currentId=id;

  const ep=getEpisode();

  if(!ep) return;

  document.getElementById(
    'home'
  ).classList.add('hidden');

  document.getElementById(
    'episodeView'
  ).classList.remove('hidden');

  document.getElementById(
    'currentTitle'
  ).textContent=ep.name;

  const players=getPlayers(ep);

  document.getElementById(
    'summary'
  ).textContent=
    ep.scenes.length+
    ' sahne · '+
    players.length+
    ' oyuncu';

  renderPlayers(ep);
  renderScenes(ep);

  showTab('players');

  window.scrollTo(0,0);
}

function goHome(){

  currentId=null;

  document.getElementById(
    'episodeView'
  ).classList.add('hidden');

  document.getElementById(
    'home'
  ).classList.remove('hidden');

  renderEpisodes();

  window.scrollTo(0,0);
}

function deleteEpisode(id){

  if(!confirm(
    'Bu bölümü silmek istiyor musun?'
  )){
    return;
  }

  let eps=loadEpisodes().filter(
    x=>x.id!==id
  );

  saveEpisodes(eps);

  renderEpisodes();
}

function showTab(tab){

  const pv=
    document.getElementById(
      'playersView'
    );

  const sv=
    document.getElementById(
      'scenesView'
    );

  const tp=
    document.getElementById(
      'tabPlayers'
    );

  const ts=
    document.getElementById(
      'tabScenes'
    );

  if(tab==='players'){

    pv.classList.remove('hidden');
    sv.classList.add('hidden');

    tp.classList.add('active');
    ts.classList.remove('active');

  }else{

    sv.classList.remove('hidden');
    pv.classList.add('hidden');

    ts.classList.add('active');
    tp.classList.remove('active');
  }
}

function noteKey(player,sceneNo,col){

  return [
    fold(player),
    sceneNo,
    col
  ].join('|');
}

function saveNote(player,sceneNo,col,value){

  let eps=loadEpisodes();

  let ep=eps.find(
    x=>x.id===currentId
  );

  if(!ep) return;

  ep.notes=ep.notes||{};

  ep.notes[
    noteKey(
      player,
      sceneNo,
      col
    )
  ]=value;

  saveEpisodes(eps);
}

function renderPlayers(ep){

  const root=
    document.getElementById(
      'playersView'
    );

  const players=getPlayers(ep);

  if(!players.length){

    root.innerHTML=`
      <div class="card">
        Oyuncu bulunamadı.
      </div>
    `;

    return;
  }

  root.innerHTML=
    players.map(player=>{

      const scenes=ep.scenes.filter(
        s=>
          (s.players||[])
          .some(
            p=>sameName(p,player)
          )
      );

      return `
        <div class="player-card">

          <div class="player-head">
            ${esc(player)}
            — ${scenes.length} sahne
          </div>

          ${scenes.map(scene=>{

            const n1=
              ep.notes?.[
                noteKey(
                  player,
                  scene.no,
                  1
                )
              ]||'';

            const n2=
              ep.notes?.[
                noteKey(
                  player,
                  scene.no,
                  2
                )
              ]||'';

            return `
              <div class="scene-row">

                <div class="scene-title">
                  SAHNE ${scene.no}
                </div>

                <div class="location">
                  ${esc(scene.location)}
                  ${scene.io ?
                    ' · '+esc(scene.io)
                    :''
                  }
                  ${scene.time ?
                    ' · '+esc(scene.time)
                    :''
                  }
                </div>

                <div class="notes">

                  <textarea
                    placeholder="Makyaj devamlılık notu"
                    oninput="saveNote(
                      '${escJS(player)}',
                      ${scene.no},
                      1,
                      this.value
                    )"
                  >${esc(n1)}</textarea>

                  <textarea
                    placeholder="Ek not"
                    oninput="saveNote(
                      '${escJS(player)}',
                      ${scene.no},
                      2,
                      this.value
                    )"
                  >${esc(n2)}</textarea>

                </div>

                <div style="margin-top:8px">

                  <label class="btn secondary no-print">
                    Fotoğraf Ekle
                    <input
                      type="file"
                      accept="image/*"
                      capture="environment"
                      style="display:none"
                      onchange="addPhoto(
                        '${escJS(player)}',
                        ${scene.no},
                        this
                      )"
                    >
                  </label>

                </div>

                <div
                  class="photo-wrap"
                  id="${photoBoxId(
                    player,
                    scene.no
                  )}"
                ></div>

              </div>
            `;

          }).join('')}

        </div>
      `;

    }).join('');

  loadAllPhotos(ep);
}

function renderScenes(ep){

  const root=
    document.getElementById(
      'scenesView'
    );

  root.innerHTML=
    ep.scenes.map(scene=>`

      <div class="scene-card">

        <div class="scene-title">
          SAHNE ${scene.no}
        </div>

        <div class="location">
          ${esc(scene.location)}
          ${scene.io ?
            ' · '+esc(scene.io)
            :''
          }
          ${scene.time ?
            ' · '+esc(scene.time)
            :''
          }
        </div>

        <div>

          ${
            scene.players.length
            ?
            scene.players.map(
              p=>
                `<span class="badge">
                  ${esc(p)}
                </span>`
            ).join('')
            :
            '<span class="small">'+
            'Oyuncu bulunamadı'+
            '</span>'
          }

        </div>

      </div>

    `).join('');
}

function escJS(s){

  return String(s)
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'");
}

/* =========================
   FOTOĞRAF VERİTABANI
   ========================= */

let dbPromise=null;

function openDB(){

  if(dbPromise){
    return dbPromise;
  }

  dbPromise=new Promise(
    (resolve,reject)=>{

      const req=
        indexedDB.open(
          'cetoSenaryoPhotos',
          1
        );

      req.onupgradeneeded=()=>{

        const db=req.result;

        if(
          !db.objectStoreNames
          .contains('photos')
        ){
          db.createObjectStore(
            'photos',
            {
              keyPath:'id'
            }
          );
        }
      };

      req.onsuccess=()=>
        resolve(req.result);

      req.onerror=()=>
        reject(req.error);
    }
  );

  return dbPromise;
}

function photoPrefix(
  episodeId,
  player,
  sceneNo
){

  return [
    episodeId,
    fold(player),
    sceneNo
  ].join('|');
}

function photoBoxId(
  player,
  sceneNo
){

  let raw=
    fold(player)+'_'+sceneNo;

  return 'photos_'+
    raw.replace(
      /[^A-Z0-9]/g,
      '_'
    );
}

async function addPhoto(
  player,
  sceneNo,
  input
){

  const file=input.files?.[0];

  if(!file) return;

  try{

    const db=await openDB();

    const id=
      photoPrefix(
        currentId,
        player,
        sceneNo
      )+
      '|'+
      uid();

    await new Promise(
      (resolve,reject)=>{

        const tx=
          db.transaction(
            'photos',
            'readwrite'
          );

        tx.objectStore(
          'photos'
        ).put({
          id:id,
          episodeId:currentId,
          player:player,
          sceneNo:sceneNo,
          blob:file
        });

        tx.oncomplete=resolve;
        tx.onerror=()=>reject(tx.error);
      }
    );

    input.value='';

    loadPhotos(
      currentId,
      player,
      sceneNo
    );

  }catch(e){

    console.error(e);

    alert(
      'Fotoğraf kaydedilemedi.'
    );
  }
}

async function getPhotos(
  episodeId,
  player,
  sceneNo
){

  const db=await openDB();

  return await new Promise(
    (resolve,reject)=>{

      const tx=
        db.transaction(
          'photos',
          'readonly'
        );

      const req=
        tx.objectStore(
          'photos'
        ).getAll();

      req.onsuccess=()=>{

        const prefix=
          photoPrefix(
            episodeId,
            player,
            sceneNo
          )+'|';

        resolve(
          req.result.filter(
            x=>
              x.id.startsWith(prefix)
          )
        );
      };

      req.onerror=()=>
        reject(req.error);
    }
  );
}

async function loadPhotos(
  episodeId,
  player,
  sceneNo
){

  const box=
    document.getElementById(
      photoBoxId(
        player,
        sceneNo
      )
    );

  if(!box) return;

  const photos=
    await getPhotos(
      episodeId,
      player,
      sceneNo
    );

  box.innerHTML='';

  for(const p of photos){

    const url=
      URL.createObjectURL(
        p.blob
      );

    const wrap=
      document.createElement('div');

    wrap.style.position=
      'relative';

    const img=
      document.createElement('img');

    img.src=url;
    img.className='photo';

    img.onload=()=>{
      URL.revokeObjectURL(url);
    };

    const del=
      document.createElement('button');

    del.textContent='×';

    del.className=
      'danger no-print';

    del.style.position=
      'absolute';

    del.style.right='2px';
    del.style.top='2px';
    del.style.padding='2px 7px';

    del.onclick=async()=>{

      await deletePhoto(p.id);

      loadPhotos(
        episodeId,
        player,
        sceneNo
      );
    };

    wrap.appendChild(img);
    wrap.appendChild(del);

    box.appendChild(wrap);
  }
}

async function deletePhoto(id){

  const db=await openDB();

  await new Promise(
    (resolve,reject)=>{

      const tx=
        db.transaction(
          'photos',
          'readwrite'
        );

      tx.objectStore(
        'photos'
      ).delete(id);

      tx.oncomplete=resolve;

      tx.onerror=()=>
        reject(tx.error);
    }
  );
}

function loadAllPhotos(ep){

  const players=getPlayers(ep);

  for(const player of players){

    const scenes=
      ep.scenes.filter(
        s=>
          (s.players||[])
          .some(
            p=>sameName(p,player)
          )
      );

    for(const scene of scenes){

      loadPhotos(
        ep.id,
        player,
        scene.no
      );
    }
  }
}

/* =========================
   CSV
   ========================= */

function csvCell(v){

  return '"'+
    String(v??'')
      .replace(/"/g,'""')+
    '"';
}

function exportCSV(){

  const ep=getEpisode();

  if(!ep) return;

  let rows=[
    [
      'Oyuncu',
      'Sahne',
      'Mekan',
      'İç/Dış',
      'Gün/Gece',
      'Makyaj Devamlılık',
      'Ek Not'
    ]
  ];

  for(const player of getPlayers(ep)){

    for(
      const scene of ep.scenes.filter(
        s=>
          (s.players||[])
          .some(
            p=>sameName(p,player)
          )
      )
    ){

      rows.push([
        player,
        scene.no,
        scene.location,
        scene.io,
        scene.time,
        ep.notes?.[
          noteKey(
            player,
            scene.no,
            1
          )
        ]||'',
        ep.notes?.[
          noteKey(
            player,
            scene.no,
            2
          )
        ]||''
      ]);
    }
  }

  const csv=
    '\uFEFF'+
    rows.map(
      r=>
        r.map(csvCell).join(';')
    ).join('\n');

  const blob=
    new Blob(
      [csv],
      {
        type:
          'text/csv;charset=utf-8'
      }
    );

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement('a');

  a.href=url;

  a.download=
    ep.name.replace(
      /[^a-z0-9çğıöşü]+/gi,
      '_'
    )+
    '_dokum.csv';

  a.click();

  setTimeout(
    ()=>URL.revokeObjectURL(url),
    1000
  );
}
